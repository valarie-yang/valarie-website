<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1620" viewBox="0 0 1080 1620" role="img" aria-labelledby="title desc">
  <title id="title">AI assignment grading workflow</title>
  <desc id="desc">Assignment requirements are used to draft a rubric, which a teacher reviews and locks before a locally configured AI bridge creates criterion-linked preliminary scoring. The teacher reviews, edits, and confirms the final grade.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#18243a"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#e4b56d"/></marker><style>.ey{font:700 26px Arial,sans-serif;letter-spacing:4px;fill:#e4b56d}.head{font:700 48px Arial,sans-serif;fill:#f4f0e8}.sub{font:28px Arial,sans-serif;fill:#b7c3d4}.step{font:700 25px Arial,sans-serif;letter-spacing:3px;fill:#e4b56d}.title{font:700 37px Arial,sans-serif;fill:#fff}.body{font:28px Arial,sans-serif;fill:#c7d1df}.note{font:700 24px Arial,sans-serif;letter-spacing:3px;fill:#e4b56d}.small{font:25px Arial,sans-serif;fill:#aab7ca}</style></defs>
  <rect width="1080" height="1620" rx="30" fill="url(#bg)"/>
  <text x="70" y="92" class="ey">APPLIED AI · TEACHER-IN-THE-LOOP</text><text x="70" y="158" class="head">From assignment brief to</text><text x="70" y="216" class="head">teacher-confirmed grade</text><text x="70" y="267" class="sub">AI drafts evidence-linked suggestions; the teacher decides.</text>
  <g><rect x="70" y="320" width="940" height="205" rx="22" fill="#202e44" stroke="#42536c"/><text x="112" y="366" class="step">01 · INPUT</text><text x="112" y="421" class="title">Assignment requirements</text><text x="112" y="472" class="body">Define the task and learning objectives.</text></g>
  <path d="M540 530v34" stroke="#e4b56d" stroke-width="5" marker-end="url(#arrow)"/>
  <g><rect x="70" y="575" width="940" height="205" rx="22" fill="#202e44" stroke="#9b7749" stroke-width="3"/><text x="112" y="621" class="step">02 · TEACHER GATE</text><text x="112" y="676" class="title">Review and lock the rubric</text><text x="112" y="727" class="body">Draft criteria from requirements; teacher approves.</text></g>
  <path d="M540 785v34" stroke="#e4b56d" stroke-width="5" marker-end="url(#arrow)"/>
  <g><rect x="70" y="830" width="940" height="205" rx="22" fill="#202e44" stroke="#42536c"/><text x="112" y="876" class="step">03 · AI PRELIMINARY</text><text x="112" y="931" class="title">Criterion-linked score draft</text><text x="112" y="982" class="body">Suggestions are tied to criteria and response evidence.</text></g>
  <path d="M540 1040v34" stroke="#e4b56d" stroke-width="5" marker-end="url(#arrow)"/>
  <g><rect x="70" y="1085" width="940" height="205" rx="22" fill="#202e44" stroke="#9b7749" stroke-width="3"/><text x="112" y="1131" class="step">04 · TEACHER DECISION</text><text x="112" y="1186" class="title">Review, edit, confirm</text><text x="112" y="1237" class="body">The teacher owns the final grade.</text></g>
  <rect x="70" y="1350" width="940" height="250" rx="20" fill="#111a28" stroke="#42536c"/><text x="105" y="1400" class="note">CURRENT BOUNDARY</text><text x="105" y="1447" class="small">Public page: workbench UI only. AI scoring requires a</text><text x="105" y="1484" class="small">separately configured local bridge—not a hosted service.</text><text x="105" y="1529" class="small">Enabled scoring sends submission text, assignment name,</text><text x="105" y="1566" class="small">and rubric to the configured provider. Use authorized work.</text>
</svg>
