<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1620" viewBox="0 0 1080 1620" role="img" aria-labelledby="title desc">
  <title id="title">Muzhi teaching image-to-question workflow</title>
  <desc id="desc">A teacher selects an original or authorized teaching-case image, optionally sets a learning focus, uses a manually configured DeepSeek API to draft a question, then edits and reviews it before saving it in the current browser's local question bank. This is not connected to the public student practice page.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#18243a"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#e4b56d"/></marker><style>.ey{font:700 26px Arial,sans-serif;letter-spacing:4px;fill:#e4b56d}.head{font:700 48px Arial,sans-serif;fill:#f4f0e8}.sub{font:28px Arial,sans-serif;fill:#b7c3d4}.step{font:700 25px Arial,sans-serif;letter-spacing:3px;fill:#e4b56d}.title{font:700 37px Arial,sans-serif;fill:#fff}.body{font:28px Arial,sans-serif;fill:#c7d1df}.note{font:700 24px Arial,sans-serif;letter-spacing:3px;fill:#e4b56d}.small{font:25px Arial,sans-serif;fill:#aab7ca}</style></defs>
  <rect width="1080" height="1620" rx="30" fill="url(#bg)"/>
  <text x="70" y="92" class="ey">MUZHI · TEACHER CONTENT AUTHORING</text><text x="70" y="158" class="head">Turn a teaching image into</text><text x="70" y="216" class="head">a reviewable question draft</text><text x="70" y="267" class="sub">Teacher review comes before saving to a local bank.</text>
  <g><rect x="70" y="320" width="940" height="205" rx="22" fill="#202e44" stroke="#42536c"/><text x="112" y="366" class="step">01 · TEACHER INPUT</text><text x="112" y="421" class="title">Original or authorized image</text><text x="112" y="472" class="body">Add an optional prompt for the learning focus.</text></g>
  <path d="M540 530v34" stroke="#e4b56d" stroke-width="5" marker-end="url(#arrow)"/>
  <g><rect x="70" y="575" width="940" height="205" rx="22" fill="#202e44" stroke="#42536c"/><text x="112" y="621" class="step">02 · AI DRAFT</text><text x="112" y="676" class="title">Generate a candidate question</text><text x="112" y="727" class="body">Image + optional focus through configured DeepSeek API.</text></g>
  <path d="M540 785v34" stroke="#e4b56d" stroke-width="5" marker-end="url(#arrow)"/>
  <g><rect x="70" y="830" width="940" height="205" rx="22" fill="#202e44" stroke="#9b7749" stroke-width="3"/><text x="112" y="876" class="step">03 · TEACHER REVIEW</text><text x="112" y="931" class="title">Edit and verify the draft</text><text x="112" y="982" class="body">Check the question, answer, and explanation.</text></g>
  <path d="M540 1040v34" stroke="#e4b56d" stroke-width="5" marker-end="url(#arrow)"/>
  <g><rect x="70" y="1085" width="940" height="205" rx="22" fill="#202e44" stroke="#42536c"/><text x="112" y="1131" class="step">04 · LOCAL SAVE</text><text x="112" y="1186" class="title">Current browser's question bank</text><text x="112" y="1237" class="body">Reviewed items stay on this browser.</text></g>
  <rect x="70" y="1350" width="940" height="250" rx="20" fill="#111a28" stroke="#42536c"/><text x="105" y="1400" class="note">CURRENT BOUNDARY</text><text x="105" y="1447" class="small">Manual API configuration + network required. Local bank</text><text x="105" y="1484" class="small">is not connected to the separate student practice page.</text><text x="105" y="1529" class="small">Image and prompt/context go to DeepSeek. Use authorized,</text><text x="105" y="1566" class="small">non-sensitive materials. Teaching only—not diagnosis.</text>
</svg>
