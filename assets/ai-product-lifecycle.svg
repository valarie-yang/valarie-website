<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">AI product prototype lifecycle</title>
  <desc id="desc">Seven stages from a product hypothesis and task definition through an MVP, vibe-coded implementation, human and AI review, deployment surface, and feedback validation. A feedback arrow returns from validation to the product hypothesis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#18243a"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e4b56d"/></marker>
    <style>.h{font:600 34px Inter,Arial,sans-serif;fill:#f4f0e8}.s{font:19px Inter,Arial,sans-serif;fill:#b7c3d4}.n{font:700 15px Inter,Arial,sans-serif;letter-spacing:1.7px;fill:#e4b56d}.t{font:600 19px Inter,Arial,sans-serif;fill:#fff}.b{font:16px Inter,Arial,sans-serif;fill:#c7d1df}.f{font:16px Inter,Arial,sans-serif;fill:#aab7ca}</style>
  </defs>
  <rect width="1200" height="670" rx="28" fill="url(#bg)"/>
  <text x="64" y="78" class="n">FROM PRODUCT HYPOTHESIS TO LEARNING LOOP</text>
  <text x="64" y="128" class="h">How I take an AI product from 0 to 1</text>
  <text x="64" y="164" class="s">Vibe coding speeds up the prototype; it does not replace validation.</text>
  <g transform="translate(64 224)"><rect width="254" height="132" rx="16" fill="#202e44" stroke="#9b7749" stroke-width="2"/><text x="20" y="31" class="n">01 · DISCOVER</text><text x="20" y="69" class="t">Product hypothesis</text><text x="20" y="103" class="b">Name the user task</text></g>
  <g transform="translate(352 224)"><rect width="254" height="132" rx="16" fill="#202e44" stroke="#42536c"/><text x="20" y="31" class="n">02 · DEFINE</text><text x="20" y="69" class="t">Task &amp; constraints</text><text x="20" y="103" class="b">Choose what matters</text></g>
  <g transform="translate(640 224)"><rect width="254" height="132" rx="16" fill="#202e44" stroke="#42536c"/><text x="20" y="31" class="n">03 · SCOPE</text><text x="20" y="69" class="t">Smallest useful MVP</text><text x="20" y="103" class="b">Make the core flow testable</text></g>
  <g transform="translate(928 224)"><rect width="208" height="132" rx="16" fill="#202e44" stroke="#42536c"/><text x="20" y="31" class="n">04 · BUILD</text><text x="20" y="69" class="t">Vibe-coded flow</text><text x="20" y="103" class="b">Implement &amp; inspect</text></g>
  <path d="M322 290 H342" stroke="#e4b56d" stroke-width="3" marker-end="url(#arrow)"/><path d="M610 290 H630" stroke="#e4b56d" stroke-width="3" marker-end="url(#arrow)"/><path d="M898 290 H918" stroke="#e4b56d" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(928 414)"><rect width="208" height="132" rx="16" fill="#202e44" stroke="#42536c"/><text x="20" y="31" class="n">05 · TEST</text><text x="20" y="69" class="t">Human + AI review</text><text x="20" y="103" class="b">Find failure cases</text></g>
  <g transform="translate(640 414)"><rect width="254" height="132" rx="16" fill="#202e44" stroke="#42536c"/><text x="20" y="31" class="n">06 · RELEASE</text><text x="20" y="69" class="t">Deploy a safe surface</text><text x="20" y="103" class="b">State what is live</text></g>
  <g transform="translate(352 414)"><rect width="254" height="132" rx="16" fill="#202e44" stroke="#9b7749" stroke-width="2"/><text x="20" y="31" class="n">07 · LEARN</text><text x="20" y="69" class="t">Validate with feedback</text><text x="20" y="103" class="b">Measure before claiming</text></g>
  <path d="M918 480 H904" stroke="#e4b56d" stroke-width="3" marker-end="url(#arrow)"/><path d="M630 480 H616" stroke="#e4b56d" stroke-width="3" marker-end="url(#arrow)"/><path d="M342 480 H326 Q304 480 304 458 V194 Q304 180 286 180 H178 Q146 180 146 210" fill="none" stroke="#e4b56d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="64" y="610" class="f">Two portfolio prototypes are presented as public case pages; classroom outcomes, accuracy, and time savings remain unvalidated.</text>
</svg>
