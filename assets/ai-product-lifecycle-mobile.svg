<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2110" viewBox="0 0 1080 2110" role="img" aria-labelledby="title desc">
  <title id="title">AI product prototype lifecycle</title>
  <desc id="desc">Seven stages from a product hypothesis and task definition through an MVP, vibe-coded implementation, human and AI review, deployment surface, and feedback validation. A feedback arrow returns from validation to the product hypothesis.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#18243a"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#e4b56d"/></marker><style>.ey{font:700 26px Arial,sans-serif;letter-spacing:4px;fill:#e4b56d}.head{font:700 48px Arial,sans-serif;fill:#f4f0e8}.sub{font:28px Arial,sans-serif;fill:#b7c3d4}.step{font:700 24px Arial,sans-serif;letter-spacing:3px;fill:#e4b56d}.title{font:700 36px Arial,sans-serif;fill:#fff}.body{font:27px Arial,sans-serif;fill:#c7d1df}.small{font:24px Arial,sans-serif;fill:#aab7ca}</style></defs>
  <rect width="1080" height="2110" rx="30" fill="url(#bg)"/>
  <text x="70" y="92" class="ey">FROM HYPOTHESIS TO LEARNING LOOP</text><text x="70" y="158" class="head">How I take an AI product</text><text x="70" y="216" class="head">from 0 to 1</text><text x="70" y="267" class="sub">Vibe coding speeds up a prototype—not validation.</text>
  <g><rect x="145" y="330" width="790" height="165" rx="22" fill="#202e44" stroke="#9b7749" stroke-width="3"/><text x="190" y="375" class="step">01 · DISCOVER</text><text x="190" y="428" class="title">Product hypothesis</text><text x="190" y="468" class="body">Name the user and the task to improve.</text></g>
  <path d="M540 500v36" stroke="#e4b56d" stroke-width="5" marker-end="url(#arrow)"/>
  <g><rect x="145" y="550" width="790" height="165" rx="22" fill="#202e44" stroke="#42536c"/><text x="190" y="595" class="step">02 · DEFINE</text><text x="190" y="648" class="title">Task and constraints</text><text x="190" y="688" class="body">Understand boundaries and trade-offs.</text></g>
  <path d="M540 720v36" stroke="#e4b56d" stroke-width="5" marker-end="url(#arrow)"/>
  <g><rect x="145" y="770" width="790" height="165" rx="22" fill="#202e44" stroke="#42536c"/><text x="190" y="815" class="step">03 · SCOPE</text><text x="190" y="868" class="title">Smallest useful MVP</text><text x="190" y="908" class="body">Make one core workflow testable.</text></g>
  <path d="M540 940v36" stroke="#e4b56d" stroke-width="5" marker-end="url(#arrow)"/>
  <g><rect x="145" y="990" width="790" height="165" rx="22" fill="#202e44" stroke="#42536c"/><text x="190" y="1035" class="step">04 · BUILD</text><text x="190" y="1088" class="title">Vibe-coded implementation</text><text x="190" y="1128" class="body">Build quickly, then inspect the flow.</text></g>
  <path d="M540 1160v36" stroke="#e4b56d" stroke-width="5" marker-end="url(#arrow)"/>
  <g><rect x="145" y="1210" width="790" height="165" rx="22" fill="#202e44" stroke="#42536c"/><text x="190" y="1255" class="step">05 · TEST</text><text x="190" y="1308" class="title">Human + AI review</text><text x="190" y="1348" class="body">Find failure cases before release.</text></g>
  <path d="M540 1380v36" stroke="#e4b56d" stroke-width="5" marker-end="url(#arrow)"/>
  <g><rect x="145" y="1430" width="790" height="165" rx="22" fill="#202e44" stroke="#42536c"/><text x="190" y="1475" class="step">06 · RELEASE</text><text x="190" y="1528" class="title">Deploy a safe surface</text><text x="190" y="1568" class="body">Say clearly what is—and is not—live.</text></g>
  <path d="M540 1600v36" stroke="#e4b56d" stroke-width="5" marker-end="url(#arrow)"/>
  <g><rect x="145" y="1650" width="790" height="165" rx="22" fill="#202e44" stroke="#9b7749" stroke-width="3"/><text x="190" y="1695" class="step">07 · LEARN</text><text x="190" y="1748" class="title">Validate with feedback</text><text x="190" y="1788" class="body">Measure before making outcome claims.</text></g>
  <path d="M145 1732H78V410Q78 360 130 360" fill="none" stroke="#e4b56d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="145" y="1902" class="small">Two portfolio prototypes are presented as public case pages.</text><text x="145" y="1942" class="small">Classroom outcomes, accuracy, and time savings remain unvalidated.</text>
</svg>
